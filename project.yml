# Projet XcodeGen : `xcodegen generate` crée Nuvora.xcodeproj
name: Nuvora
options:
  bundleIdPrefix: io.github.aervorn
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
  developmentLanguage: fr

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    # Sparkle compare ce numéro : l'augmenter à chaque version publiée
    CURRENT_PROJECT_VERSION: "1"

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.10.0"

targets:
  Nuvora:
    type: application
    platform: macOS
    sources:
      - path: Nuvora
        excludes:
          - "Resources/**"
      - path: Nuvora/Resources
        buildPhase: resources
    dependencies:
      - package: Sparkle
    info:
      path: Support/Info.plist
      properties:
        CFBundleDisplayName: Nuvora
        CFBundleDevelopmentRegion: fr
        CFBundleLocalizations: [fr, en]
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSApplicationCategoryType: public.app-category.productivity
        LSMinimumSystemVersion: "$(MACOSX_DEPLOYMENT_TARGET)"
        # Notes vocales : textes traduits dans Resources/InfoPlist.xcstrings
        NSMicrophoneUsageDescription: "Nuvora enregistre tes notes vocales avec le micro. L'audio reste sur ton Mac."
        NSSpeechRecognitionUsageDescription: "Nuvora transcrit tes notes vocales sur ton Mac, sans rien envoyer en ligne."
        # Sparkle : appcast.xml à la racine du dépôt, réécrit par scripts/make-dmg.sh
        SUFeedURL: https://raw.githubusercontent.com/Aervorn/MacOS_Nuvora/main/appcast.xml
        SUPublicEDKey: "$(SPARKLE_PUBLIC_ED_KEY)"
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUAutomaticallyUpdate: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aervorn.nuvora
        PRODUCT_NAME: Nuvora
        # Clé publique EdDSA de Sparkle, partagée avec Flux, Vestora et Octopus
        SPARKLE_PUBLIC_ED_KEY: "eZCHe74IeZ8DBTAY+tVftTLA2+kKJT3xD5e/QmhV2sE="
        # Icône : Nuvora/AppIcon.icon (Icon Composer), calques générés par Design/IconComposer/make_layers.py
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Traduction : Xcode remplit Resources/Localizable.xcstrings à chaque build (textes en français = clés)
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
        # Signature locale ("Sign to Run Locally") : pas besoin de compte développeur.
        # Le certificat « Aervorn Code Signing » n'est utilisé que par scripts/make-dmg.sh.
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        ENABLE_HARDENED_RUNTIME: NO
        ENABLE_APP_SANDBOX: NO
    scheme:
      testTargets:
        - NuvoraTests

  # Tests sans app hôte : ils compilent directement le modèle (dossier Core, Foundation seulement).
  NuvoraTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: NuvoraTests
      - path: Nuvora/Core
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.aervorn.nuvora.tests
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
